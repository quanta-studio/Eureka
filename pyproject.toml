[project]
name = "droid-mcp"
version = "0.1.0"
description = "Agent-oriented MCP server for driving Android devices and emulators"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Quanta Studio" },
    { name = "Claude" },
]
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp (FastMCP became MCPServer)
    "mcp>=1.30.0,<2",
    "pillow>=12.3.0",
]

[project.urls]
Repository = "https://github.com/quanta-studio/Eureka"
Issues = "https://github.com/quanta-studio/Eureka/issues"

[project.scripts]
droid-mcp = "droid_mcp:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["droid_mcp.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
